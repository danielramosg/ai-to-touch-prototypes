<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="../css/unsupervised-style.css" />

    <title>Unsupervised learning</title>
  </head>

  <body>
    <div id="container">
      <div id="infoLevel">
        <table>
          <tr>
            <td>level:</td>
            <td id="levelLabel">1</td>
          </tr>
          <tr>
            <td>correct:</td>
            <td id="correctLabel">1</td>
          </tr>
          <tr>
            <td>false:</td>
            <td id="incorrectLabel">1</td>
          </tr>
          <tr>
            <td>correct answers in a row:</td>
            <td id="correctRowLabel">1</td>
          </tr>
        </table>
      </div>

      <canvas id="mainCanvas" width="800" height="500" class="center"></canvas>
      <div id="result" class="center"></div>
      <div id="ansBtnsContainer"></div>

      <div id="button3" class="hidden button center">restart</div>
      <div id="button4" class="hidden button center">proceed to next level</div>
      <div id="button5" class="hidden button center">
        how the computer would learn?
      </div>
      <div id="cImgContainer"></div>
    </div>

    <script type="module" src="../ts/main.ts"></script>
  </body>
</html>
