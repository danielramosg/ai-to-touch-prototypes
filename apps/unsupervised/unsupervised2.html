<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="unsupervised-style.css" />
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.0.0/dist/tf.min.js"></script>

    <title>Unsupervised learning</title>
  </head>

  <body>
    <div id="container">
      <div id="infoLevel">
        <table>
          <tr>
            <td>level:</td>
            <td id="levelLabel">1</td>
          </tr>
          <tr>
            <td>correct:</td>
            <td id="correctLabel">1</td>
          </tr>
          <tr>
            <td>false:</td>
            <td id="incorrectLabel">1</td>
          </tr>
          <tr>
            <td>correct answers in a row:</td>
            <td id="correctRowLabel">1</td>
          </tr>
        </table>
      </div>

      <canvas id="mainCanvas" width="500" height="500" class="center"></canvas>
      <!-- <div id="CSCanvas"></div> -->
      <div id="button1" class="visible button">
        ya
        <!-- "yes" in Indonesian -->
      </div>
      <div id="button2" class="visible button">
        tidak
        <!-- "no" in Indonesian -->
      </div>

      <div id="button3" class="hidden button center">restart</div>
      <div id="button4" class="hidden button center">proceed to next level</div>
      <div id="button5" class="hidden button center">
        how the computer would learn?
      </div>
    </div>

    <script type="module" src="main.js"></script>
  </body>
</html>
